<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech</title>
</head>
<body>
<h1>ElevenLabs Text to Speech</h1>
<form id="speech-form">
    <p>
        <label for="text">Text</label><br>
        <textarea id="text" required rows="5" cols="60">Hello! This audio was generated by ElevenLabs.</textarea>
    </p>
    <p>
        <label for="voice-id">Voice ID</label><br>
        <input id="voice-id" required size="35" value="JBFqnCBsd6RMkjVDRZzb">
    </p>
    <button type="submit">Generate and play</button>
</form>
<p id="error" role="alert"></p>
<audio id="player" controls></audio>

<script>
    const form = document.getElementById('speech-form');
    const player = document.getElementById('player');
    const error = document.getElementById('error');
    let previousAudioUrl;

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';

        const response = await fetch('/public/text-to-speech', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                text: document.getElementById('text').value,
                voiceId: document.getElementById('voice-id').value
            })
        });

        if (!response.ok) {
            error.textContent = `Could not generate speech (HTTP ${response.status}).`;
            return;
        }

        if (previousAudioUrl) {
            URL.revokeObjectURL(previousAudioUrl);
        }
        previousAudioUrl = URL.createObjectURL(await response.blob());
        player.src = previousAudioUrl;
        await player.play();
    });
</script>
</body>
</html>
